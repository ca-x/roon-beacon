[package]
name = "roon-api"
version = "0.5.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "roon-rs SDK with Beacon's registered-connection adapter"
repository = "https://github.com/shin1ohno/roon-rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
roon-moo = "=0.5.3"
roon-sood = "=0.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
